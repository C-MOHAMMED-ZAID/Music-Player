<div 
  class="player-controls"
  *ngIf="currentSong" 
  appWaveAnimation 
  [isPlaying]="isPlaying" 
  [frequency]="2"
>
  <div class="now-playing">
    <img [src]="currentSong.coverArt" [alt]="currentSong.album" class="current-cover">
    <div class="track-info">
      <h4 class="track-title">{{ currentSong.title }}</h4>
      <p class="track-artist">{{ currentSong.artist }}</p>
    </div>
  </div>

  <div class="controls">
    <button 
      class="control-btn"
      (click)="onPrevious()"
      appRippleEffect
    >
      <i class="fas fa-step-backward"></i>
    </button>
    
    <button 
      class="play-pause-btn"
      (click)="onPlayPause()"
      appRippleEffect
      [rippleColor]="'rgba(76, 175, 80, 0.3)'"
    >
      <i class="fas" [class.fa-play]="!isPlaying" [class.fa-pause]="isPlaying"></i>
    </button>
    
    <button 
      class="control-btn"
      (click)="onNext()"
      appRippleEffect
    >
      <i class="fas fa-step-forward"></i>
    </button>
  </div>

  <div class="progress-section">
    <span class="time-current">{{ currentTime | durationFormat }}</span>
    
    <div 
      class="progress-bar"
      (mousedown)="onSeekStart($event)" 
      (mousemove)="onSeekMove($event)" 
      (mouseup)="onSeekEnd($event)" 
      (mouseleave)="onSeekEnd($event)" 
    >
      <div 
        class="progress-fill" 
        [style.width.%]="getProgressPercentage()"
      ></div>
    </div>
    
    <span class="time-total">{{ duration | durationFormat }}</span>
  </div>

  <div class="volume-controls">
    <i class="fas fa-volume-up"></i>
    <input 
      type="range" 
      class="volume-slider"
      [value]="volume"
      (input)="onVolumeChange($event)" 
      min="0" 
      max="100"
    >
    <span class="volume-percent">{{ volume }}%</span>
  </div>

</div>

<div 
  class="player-controls empty-state"
  *ngIf="!currentSong" 
>
  <p>No song selected</p>
  <p class="hint">Choose a song to start playing</p>
</div>
