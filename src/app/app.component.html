<div class="music-dashboard">
  
  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-content">
      <h1 class="app-title">
        <i class="fas fa-music"></i>
        Angular Music Player
      </h1>
      
      <!-- Search Box -->
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input 
          type="text" 
          [(ngModel)]="searchText"
          placeholder="Search songs, artists, albums..."
          class="search-input"
        >
      </div>

      <!-- View Toggle -->
      <div class="view-toggle">
        <button 
          class="toggle-btn" 
          [class.active]="activeView === 'songs'"
          (click)="onViewChange('songs')"
        >
          <i class="fas fa-list"></i> Songs
        </button>
        <button 
          class="toggle-btn"
          [class.active]="activeView === 'playlists'"
          (click)="onViewChange('playlists')"
        >
          <i class="fas fa-folder"></i> Playlists
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dashboard-main">
    
    <!-- Songs View -->
    <div class="songs-view" *ngIf="activeView === 'songs'">
      
      <!-- Sort Controls -->
      <div class="sort-controls">
        <span class="sort-label">Sort by:</span>
        
        <button 
          class="sort-btn"
          (click)="onSortChange('title')"
          [class.active]="sortField === 'title'"
        >
          Title <i [class]="getSortIcon('title')"></i>
        </button>
        
        <button 
          class="sort-btn"
          (click)="onSortChange('artist')"
          [class.active]="sortField === 'artist'"
        >
          Artist <i [class]="getSortIcon('artist')"></i>
        </button>
        
        <button 
          class="sort-btn"
          (click)="onSortChange('duration')"
          [class.active]="sortField === 'duration'"
        >
          Duration <i [class]="getSortIcon('duration')"></i>
        </button>
        
        <button 
          class="sort-btn"
          (click)="onSortChange('plays')"
          [class.active]="sortField === 'plays'"
        >
          Plays <i [class]="getSortIcon('plays')"></i>
        </button>
      </div>

      <!-- Songs Grid -->
      <div class="songs-grid">
        
        <!-- Song Cards -->
        <app-song-card 
          *ngFor="let song of songs | searchFilter:searchText | sortSongs:sortField:sortOrder" 
          [song]="song"
          [isPlaying]="isPlaying && isCurrentSong(song)"
          [isCurrentSong]="isCurrentSong(song)"
          (play)="onPlaySong(song)"
          (pause)="onPauseSong()"
          (addToPlaylist)="onAddToPlaylist(song)"
        >
        </app-song-card>

        <!-- Empty State -->
        <div class="empty-state" *ngIf="(songs | searchFilter:searchText).length === 0">
          <i class="fas fa-search fa-3x"></i>
          <h3>No songs found</h3>
          <p>Try adjusting your search terms</p>
        </div>
      </div>
    </div>

    <!-- Playlists View -->
    <div class="playlists-view" *ngIf="activeView === 'playlists'">
      <h2>Your Playlists</h2>
      
      <div class="playlists-grid">
        <div 
          class="playlist-card" 
          *ngFor="let playlist of playlists"
          appHoverEffect
        >
          <div class="playlist-cover">
            <img [src]="playlist.coverArt" [alt]="playlist.name">
            <div class="playlist-overlay">
              <span class="song-count">{{ playlist.songs.length }} songs</span>
            </div>
          </div>
          <h3>{{ playlist.name }}</h3>
          <p>Created {{ playlist.createdDate | timeAgo }}</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Player Controls -->
  <footer class="player-footer">
    <app-player-controls
      [currentSong]="currentSong"
      [isPlaying]="isPlaying"
      [currentTime]="currentTime"
      [duration]="duration"
      [volume]="volume"
      (playPause)="onPlayPause()"
      (next)="onNextSong()"
      (previous)="onPreviousSong()"
      (seek)="onSeek($event)"
      (volumeChange)="onVolumeChange($event)"
    >
    </app-player-controls>
  </footer>

</div>
